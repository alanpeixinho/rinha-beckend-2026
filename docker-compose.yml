services:
  app1:
    build: .
    hostname: app1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  app2:
    build: .
    hostname: app2
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  lb:
    image: haproxy:3.1-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - app1
      - app2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "50MB"
