services:
  app1:
    build: .
    environment:
      PORT: "8081"
    volumes:
      - ./resources/dataset.dat:/resources/dataset.dat:ro
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "1128MB"

  app2:
    build: .
    environment:
      PORT: "8082"
    volumes:
      - ./resources/dataset.dat:/resources/dataset.dat:ro
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "1128MB"

  lb:
    image: haproxy:3.1-alpine
    entrypoint: ["haproxy", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - app1
      - app2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "16MB"
